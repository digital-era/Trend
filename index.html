<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trend · AI Vibes Investment</title>
  <meta name="description" content="公司调研 · 交易分析 · 热点事件" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card: #12161f;
      --border: rgba(255, 255, 255, 0.07);
      --text: #e8ecf4;
      --text-muted: #94a3b8;
      --accent: #f59e0b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(245, 158, 11, 0.10), transparent),
        radial-gradient(ellipse 60% 40% at 100% 0%, rgba(56, 189, 248, 0.06), transparent);
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #f59e0b, #f97316);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 8px 24px rgba(245, 158, 11, 0.25);
    }

    h1 {
      font-size: 2.3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 20%, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      margin-top: 6px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    @media (max-width: 960px) {
      .grid { grid-template-columns: 1fr; max-width: 480px; margin: 0 auto; }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }

    .card-top { height: 3px; width: 100%; }
    .card.cr .card-top { background: linear-gradient(90deg, #38bdf8, #0ea5e9); }
    .card.ta .card-top { background: linear-gradient(90deg, #34d399, #10b981); }
    .card.ht .card-top { background: linear-gradient(90deg, #f472b6, #ec4899); }

    .card-body {
      padding: 22px 20px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .card-icon {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .card.cr .card-icon { background: rgba(56, 189, 248, 0.12); }
    .card.ta .card-icon { background: rgba(52, 211, 153, 0.12); }
    .card.ht .card-icon { background: rgba(244, 114, 182, 0.12); }

    .card-title { font-size: 1.15rem; font-weight: 600; }
    .card-desc { font-size: 0.8rem; color: var(--text-muted); margin-top: 1px; }

    .file-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .file-item a {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 12px;
      border-radius: 11px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.18s ease;
      border: 1px solid transparent;
      line-height: 1.4;
    }

    .file-item a:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border);
    }

    .file-icon {
      flex-shrink: 0;
      margin-top: 1px;
      opacity: 0.65;
      font-size: 0.95rem;
    }

    .file-name {
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-all;
    }

    .arrow {
      flex-shrink: 0;
      opacity: 0;
      transform: translateX(-4px);
      transition: all 0.18s ease;
      color: var(--accent);
      font-size: 0.85rem;
      margin-top: 2px;
    }

    .file-item a:hover .arrow {
      opacity: 1;
      transform: translateX(0);
    }

    .status {
      color: var(--text-muted);
      font-size: 0.88rem;
      padding: 16px 0;
      text-align: center;
    }

    .status.error { color: #f87171; }

    footer {
      text-align: center;
      margin-top: 56px;
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-icon">📈</div>
        <h1>Trend</h1>
      </div>
      <p class="subtitle">公司调研 · 交易分析 · 热点事件</p>
    </header>

    <div class="grid">
      <section class="card cr">
        <div class="card-top"></div>
        <div class="card-body">
          <div class="card-header">
            <div class="card-icon">🏢</div>
            <div>
              <div class="card-title">公司调研</div>
              <div class="card-desc">Company Research</div>
            </div>
          </div>
          <ul class="file-list" id="list-cr">
            <li class="status">加载中...</li>
          </ul>
        </div>
      </section>

      <section class="card ta">
        <div class="card-top"></div>
        <div class="card-body">
          <div class="card-header">
            <div class="card-icon">📊</div>
            <div>
              <div class="card-title">交易分析</div>
              <div class="card-desc">Trading Analysis</div>
            </div>
          </div>
          <ul class="file-list" id="list-ta">
            <li class="status">加载中...</li>
          </ul>
        </div>
      </section>

      <section class="card ht">
        <div class="card-top"></div>
        <div class="card-body">
          <div class="card-header">
            <div class="card-icon">🔥</div>
            <div>
              <div class="card-title">热点事件</div>
              <div class="card-desc">Hot Topics</div>
            </div>
          </div>
          <ul class="file-list" id="list-ht">
            <li class="status">加载中...</li>
          </ul>
        </div>
      </section>
    </div>

    <footer>
      <p>Powered by <a href="https://github.com/digital-era/Trend" target="_blank" rel="noopener">digital-era/Trend</a></p>
    </footer>
  </div>

  <script>
    // ========== 配置 ==========
    const REPO = 'digital-era/Trend';
    const BRANCH = 'main';
    // 正确的线上域名（没有 ment）
    const SITE_ORIGIN = 'https://trend.aivibeinvest.com';

    // 美化显示名称
    function prettyName(filename) {
      return filename
        .replace(/\.html$/i, '')
        .replace(/_/g, ' · ')
        .replace(/(\d{4}-\d{2}-\d{2})/g, '· $1')
        .replace(/(\d{4}\.\d{2}\.\d{2})/g, '· $1');
    }

    // 获取某个目录下的所有 .html 文件
    async function fetchDirFiles(dir) {
      const url = `https://api.github.com/repos/${REPO}/contents/${dir}?ref=${BRANCH}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`目录 ${dir} 加载失败 (${res.status})`);
      const data = await res.json();
      return data.filter(item => item.type === 'file' && /\.html$/i.test(item.name));
    }

    // 获取单个文件的最后提交时间
    async function getLastCommitDate(path) {
      const url = `https://api.github.com/repos/${REPO}/commits?path=${encodeURIComponent(path)}&per_page=1`;
      const res = await fetch(url);
      if (!res.ok) return new Date(0);
      const data = await res.json();
      if (!data.length) return new Date(0);
      return new Date(data[0].commit.committer.date || data[0].commit.author.date);
    }

    // 渲染列表
    function renderList(containerId, files, dir) {
      const ul = document.getElementById(containerId);
      if (!files.length) {
        ul.innerHTML = '<li class="status">暂无文件</li>';
        return;
      }

      ul.innerHTML = files.map(file => {
        const display = prettyName(file.name);
        // 使用正确域名的完整链接
        const href = `${SITE_ORIGIN}/${dir}/${encodeURIComponent(file.name)}`;
        return `
          <li class="file-item">
            <a href="${href}" title="${file.name}" target="_blank" rel="noopener">
              <span class="file-icon">📄</span>
              <span class="file-name">${display}</span>
              <span class="arrow">→</span>
            </a>
          </li>
        `;
      }).join('');
    }

    // 主加载逻辑
    async function loadAll() {
      const configs = [
        { id: 'list-cr', dir: 'cr' },
        { id: 'list-ta', dir: 'ta' },
        { id: 'list-ht', dir: 'ht' }
      ];
    
      // 计算 6 天前的时间点
      const sixDaysAgo = new Date();
      sixDaysAgo.setDate(sixDaysAgo.getDate() - 6);
      sixDaysAgo.setHours(0, 0, 0, 0);   // 从当天 0 点开始算，更清晰
    
      await Promise.all(configs.map(async ({ id, dir }) => {
        try {
          const files = await fetchDirFiles(dir);
    
          // 并行获取每个文件的最后提交时间
          const withDates = await Promise.all(
            files.map(async file => {
              const date = await getLastCommitDate(file.path);
              return { ...file, lastDate: date };
            })
          );
    
          // ① 只保留最近 6 天内生成的文件
          const recentFiles = withDates.filter(f => f.lastDate >= sixDaysAgo);
    
          // ② 再按时间倒序（最新在前）
          recentFiles.sort((a, b) => b.lastDate - a.lastDate);
    
          renderList(id, recentFiles, dir);
        } catch (err) {
          console.error(dir, err);
          document.getElementById(id).innerHTML =
            `<li class="status error">加载失败，请稍后刷新</li>`;
        }
      }));
    }

    loadAll();
  </script>
</body>
</html>
